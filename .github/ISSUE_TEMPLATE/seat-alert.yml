name: 좌석 알림 신청
description: 영화와 좌석 조건을 등록합니다.
title: "[좌석 알림] "
labels:
  - seat-alert
body:
  - type: input
    id: email
    attributes:
      label: 수신 이메일
      description: 알림을 받을 이메일 주소를 입력하세요.
      placeholder: name@example.com
    validations:
      required: true
  - type: input
    id: movie
    attributes:
      label: 영화
      placeholder: 오디세이
    validations:
      required: true
  - type: input
    id: theater
    attributes:
      label: 극장
      placeholder: 용산아이파크몰
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: 상영관
      placeholder: IMAX
    validations:
      required: true
  - type: input
    id: row_range
    attributes:
      label: 관심 행 범위
      description: 좌석표의 세로 행 범위입니다. G-P를 입력하면 G, H, I, J, K, L, M, N, O, P열을 확인합니다.
      placeholder: G-P
      value: G-P
    validations:
      required: true
  - type: input
    id: consecutive_seats
    attributes:
      label: 필요한 연속 좌석 수
      description: 서로 붙어 있는 좌석이 몇 자리 필요한지 입력하세요.
      placeholder: "2"
      value: "2"
    validations:
      required: true
  - type: dropdown
    id: schedule
    attributes:
      label: 대상 회차
      description: 확인할 기간을 선택하세요. 최근 14일 안의 해당 요일을 확인합니다.
      options:
        - 주말
        - 평일
        - 전체
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: ntfy
    attributes:
      label: 추가 알림
      options:
        - label: ntfy 앱으로도 즉시 알림을 받겠습니다. 신청하면 구독 주소를 이메일로 보내드립니다.
          required: false
  - type: checkboxes
    id: consent
    attributes:
      label: 확인
      options:
        - label: 좌석 상태가 바뀌면 반복 알림을 받을 수 있음을 확인했습니다.
          required: true
