name: Register seat alert issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  register:
    if: contains(github.event.issue.labels.*.name, 'seat-alert')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse issue form
        id: fields
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          extract() {
            printf '%s\n' "$ISSUE_BODY" | awk -v heading="### $1" '
              $0 == heading { found=1; next }
              found && NF { print; exit }
            '
          }
          email="$(extract '수신 이메일')"
          movie="$(extract '영화')"
          theater="$(extract '극장')"
          screen="$(extract '상영관')"
          row_range="$(extract '관심 행 범위')"
          test -n "$row_range" || row_range="$(extract '최소 관심 행')"
          consecutive="$(extract '필요한 연속 좌석 수')"
          test -n "$consecutive" || consecutive="$(extract '필요한 연석 수')"
          schedule="$(extract '대상 회차')"
          ntfy_requested=false
          if printf '%s\n' "$ISSUE_BODY" | grep -Eiq '^[-*] \[x\].*ntfy'; then
            ntfy_requested=true
          fi
          for value in "$email" "$movie" "$theater" "$screen" "$row_range" "$consecutive" "$schedule"; do
            test -n "$value" || { echo '필수 항목이 비어 있습니다.' >&2; exit 1; }
          done
          case "$row_range" in
            [A-Z]|[A-Z]-[A-Z]) ;;
            *) echo '관심 행 범위는 G 또는 G-P 형식이어야 합니다.' >&2; exit 1 ;;
          esac
          case "$consecutive" in
            ''|*[!0-9]*) echo '연석 수는 숫자여야 합니다.' >&2; exit 1 ;;
          esac
          case "$schedule" in
            주말|평일|전체|주말\ 전체|평일\ 전체) ;;
            *) echo '대상 회차는 주말, 평일 또는 전체여야 합니다.' >&2; exit 1 ;;
          esac
          {
            echo "email=$email"
            echo "movie=$movie"
            echo "theater=$theater"
            echo "screen=$screen"
            echo "row_range=$row_range"
            echo "consecutive=$consecutive"
            echo "schedule=$schedule"
            echo "ntfy_requested=$ntfy_requested"
          } >> "$GITHUB_OUTPUT"

      - name: Confirm registration
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EMAIL: ${{ steps.fields.outputs.email }}
          MOVIE: ${{ steps.fields.outputs.movie }}
          THEATER: ${{ steps.fields.outputs.theater }}
          SCREEN: ${{ steps.fields.outputs.screen }}
          ROW_RANGE: ${{ steps.fields.outputs.row_range }}
          CONSECUTIVE: ${{ steps.fields.outputs.consecutive }}
          SCHEDULE: ${{ steps.fields.outputs.schedule }}
          NTFY_REQUESTED: ${{ steps.fields.outputs.ntfy_requested }}
        run: |
          ntfy_line=""
          if [ "$NTFY_REQUESTED" = "true" ]; then
            ntfy_line="- ntfy 알림: 신청됨 (구독 주소를 이메일로 발송합니다)"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          좌석 알림 신청이 등록되었습니다.

          - 영화: $MOVIE
          - 극장: $THEATER / $SCREEN
          - 대상 회차: $SCHEDULE
          - 관심 행 범위: $ROW_RANGE열
          - 필요한 연속 좌석: ${CONSECUTIVE}석
          - 수신 이메일: $EMAIL
          $ntfy_line

          좌석 조회 워커가 다음 주기에 이 조건을 확인합니다.
          EOF
          )"

      - name: Send ntfy subscription address
        if: steps.fields.outputs.ntfy_requested == 'true'
        env:
          EMAIL: ${{ steps.fields.outputs.email }}
          NTFY_TOPIC_URL: ${{ vars.NTFY_TOPIC_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          message = EmailMessage()
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["EMAIL"]
          message["Subject"] = "[CGV 알림] ntfy 구독 주소"
          topic_url = os.environ["NTFY_TOPIC_URL"]
          message.set_content(
              "ntfy 알림 신청이 등록되었습니다.\n\n"
              "ntfy 앱에서 아래 주소를 구독하면 상영 오픈과 빈자리 변경을 모바일 푸시로 받을 수 있습니다.\n\n"
              f"구독 주소: {topic_url}\n"
          )
          with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.environ["SMTP_PORT"]), timeout=20) as client:
              if os.environ.get("SMTP_USE_TLS", "true").lower() in {"1", "true", "yes", "on"}:
                  client.starttls()
              client.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              client.send_message(message)
          PY
