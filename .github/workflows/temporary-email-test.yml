name: Temporary email test

on:
  workflow_dispatch:

permissions: {}

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email through Gmail SMTP
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          message = EmailMessage()
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["MAIL_TO"]
          message["Subject"] = "[CGV 알리미] SMTP 테스트"
          message.set_content(
              "CGV 예매 알리미의 Gmail SMTP 발송 테스트입니다.\n"
              "이 메일이 도착하면 SMTP 설정이 정상입니다."
          )

          with smtplib.SMTP(
              os.environ["SMTP_HOST"],
              int(os.environ["SMTP_PORT"]),
              timeout=20,
          ) as client:
              if os.environ["SMTP_USE_TLS"].lower() == "true":
                  client.starttls()
              client.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              client.send_message(message)

          print("SMTP test message sent")
          PY
